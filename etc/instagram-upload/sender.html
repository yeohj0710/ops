<!doctype html>
<meta charset="utf-8">
<title>Instagram upload sender</title>
<body>전송 중…</body>
<script>
(async () => {
  const response = await fetch('/reel.mp4');
  const blob = await response.blob();
  const file = new File([blob], 'reel.mp4', { type: 'video/mp4' });
  if (!window.opener) {
    document.body.textContent = 'opener 없음';
    return;
  }
  window.opener.postMessage({ file }, 'https://www.instagram.com');
  document.body.textContent = '전송 완료';
  setTimeout(() => window.close(), 500);
})();
</script>
